# Cuts a release when a version tag is pushed: builds the archive, opens a draft GitHub
# release, publishes it to the Bazel Central Registry, then finalizes the release.
#
# The same tag push also runs docs.yml, which deploys the versioned docs site
# (/<tag>/, and /stable/ for the newest). That is why the tag has to be pushed from a
# clone rather than created by a workflow: a tag created with GITHUB_TOKEN triggers no
# further workflows, so the docs would never build.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# MODULE.bazel's version must already say 0.1.0, and CHANGELOG.md must have a "## 0.1.0"
# section; release_prep.sh refuses otherwise. That section is the release notes, here and in
# the BCR pull request.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write       # attest provenance
  attestations: write   # attest provenance
  contents: write       # create the release and upload the archive

jobs:
  release:
    # https://github.com/bazel-contrib/.github/blob/master/.github/workflows/release_ruleset.yaml
    # Runs .github/workflows/release_prep.sh to build the archive and the notes.
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      # Named after the repository, to match .bcr/source.template.json; see release_prep.sh.
      release_files: ${{ github.event.repository.name }}-*.tar.gz
      # The root module declares no tests (they are in e2e/, a separate module), and
      # `bazel test` with nothing to run exits nonzero, so this only checks it builds.
      bazel_test_command: "bazel build //..."
      prerelease: false
      # A draft, so publish.yaml can attach attestations before the release becomes
      # immutable. finalize publishes it.
      draft: true
      tag_name: ${{ github.ref_name }}

  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

  # publish-to-bcr opens the BCR pull request with a fixed body, a link to the release and
  # nothing else, and has no input to change it. Registry maintainers review from that pull
  # request, so this puts the CHANGELOG.md notes at the top of it. publish-to-bcr names the
  # branch <module>-<tag> on the fork, which is how the pull request is found. A failure here
  # leaves the release and the pull request as they are: add the notes by hand.
  bcr_notes:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
      TAG: ${{ github.ref_name }}
      # Must match publish.yaml's registry_fork and MODULE.bazel's module name.
      FORK_OWNER: csvance
      MODULE: julia_depot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Put the release notes in the BCR pull request
        run: |
          set -o errexit -o nounset -o pipefail
          marker="<!-- julia_depot release notes -->"
          pr="$(gh pr list --repo bazelbuild/bazel-central-registry --head "${MODULE}-${TAG}" \
            --state open --json url,body,headRepositoryOwner \
            --jq "map(select(.headRepositoryOwner.login == \"${FORK_OWNER}\")) | first")"
          if [[ -z "${pr}" || "${pr}" == null ]]; then
            echo "no open BCR pull request from ${FORK_OWNER}:${MODULE}-${TAG}" >&2
            exit 1
          fi
          url="$(jq -r .url <<<"${pr}")"
          body="$(jq -r .body <<<"${pr}")"
          if [[ "${body}" == *"${marker}"* ]]; then
            echo "${url} already has the notes"
            exit 0
          fi
          {
            echo "${marker}"
            .github/workflows/release_notes.sh "${TAG#v}"
            echo
            echo "---"
            echo
            echo "${body}"
          } > "${RUNNER_TEMP}/body.md"
          gh pr edit "${url}" --body-file "${RUNNER_TEMP}/body.md"
          echo "notes added to ${url}"

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
