name: e2e

# The end-to-end suite for one Julia version, called by one small workflow per version
# (julia-1.12.yml, julia-1.13.yml, ...). GitHub status badges are per workflow, so a matrix
# would give all versions one badge; a workflow per version gives each its own.

on:
  workflow_call:
    inputs:
      julia:
        description: The Julia minor, e.g. "1.13". Keys the caches and names the run.
        required: true
        type: string
      tag:
        # The Bazel test tag that selects this version's tests. It must be derived from the
        # version the same way tests/defs.bzl derives it. A tag that matches nothing would
        # pass with no tests run, so the test step below fails on an empty target list.
        description: The Bazel test tag for this version, e.g. "julia1_13".
        required: true
        type: string

# pull-requests: read is for the changes job; a called workflow can hold no permission
# its caller does not grant, so each julia-*.yml grants it too.
permissions:
  contents: read
  pull-requests: read

env:
  # The runner has no private network, so pin the public package server. e2e/.bazelrc sets
  # the same pin for repository rules and e2e/tests/defs.bzl for test actions; this one
  # covers anything run outside Bazel.
  JULIA_PKG_SERVER: https://pkg.julialang.org

jobs:
  # Whether anything the suite exercises changed. The filter lists what cannot change
  # behaviour (the documentation, its site and the docs workflow) and counts everything
  # else, so a new rule file, script or test directory is in scope without being added
  # here. A manual dispatch always runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # dorny/paths-filter reads changed files from the PR
    outputs:
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          # `every`: a file counts only when it matches all the patterns, so the negations
          # exclude files.
          predicate-quantifier: every
          filters: |
            rules:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!LICENSE'
              - '!.github/workflows/docs.yml'

  e2e:
    needs: changes
    # A skipped e2e job counts as success for required-check gating, so a docs-only
    # change merges without waiting on the suite.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rules == 'true' }}
    name: e2e julia ${{ inputs.julia }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install bazelisk
        env:
          BAZELISK_VERSION: "1.29.0"
        # Installed to a user directory because the runner's shell is not root, and curl
        # fails to write to /usr/local/bin with "Failure writing output to destination".
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/bazel" \
            "https://github.com/bazelbuild/bazelisk/releases/download/v${BAZELISK_VERSION}/bazelisk-linux-amd64"
          chmod +x "$HOME/.local/bin/bazel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bazel" --version

      # The depot holds the expensive part of this suite: the instantiated and precompiled
      # manifests. It is keyed on the manifests, so a run that changes none of them starts
      # warm.
      - uses: actions/cache@v4
        with:
          path: ~/.julia
          key: julia-depot-${{ inputs.julia }}-${{ hashFiles('e2e/projects/**/Manifest.toml', 'julia/sysimage/**/Manifest.toml') }}
          restore-keys: julia-depot-${{ inputs.julia }}-

      - uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-${{ inputs.julia }}-${{ hashFiles('e2e/MODULE.bazel', 'MODULE.bazel') }}
          restore-keys: bazel-disk-${{ inputs.julia }}-

      # Each test is tagged with the Julia it runs, so every test in this run needs only
      # this version's toolchain and depot. Each cross-version refusal test runs in the
      # workflow of the Julia it runs, so the per-version workflows together cover both
      # directions.
      #
      # The targets come from a query. --test_tag_filters still analyses the tests it
      # excludes, and analysing a test fetches its depot, so each runner would instantiate
      # every Julia version to run one, which is most of the wall clock.
      - name: bazel test
        working-directory: e2e
        run: |
          set -euo pipefail
          targets="$(bazel query "attr(tags, '${{ inputs.tag }}', tests(//...))")"
          test -n "$targets" || {
            echo "no tests tagged ${{ inputs.tag }}; the tag and tests/defs.bzl disagree" >&2
            exit 1
          }
          echo "$targets"
          # shellcheck disable=SC2086
          bazel test $targets \
            --disk_cache="$HOME/.cache/bazel-disk" \
            --test_output=errors \
            --keep_going

      - name: Test logs
        if: failure()
        working-directory: e2e
        run: |
          for log in $(find -L bazel-testlogs -name test.log); do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
