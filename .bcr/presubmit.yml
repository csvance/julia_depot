# What BCR's CI runs against each published version. It builds the e2e module, which is
# already a consumer of this one: BCR extracts the release archive and runs bazel in
# e2e/, where the local_path_override to ".." lands on the archive's own root.
#
# A smoke subset rather than //...: the full suite downloads two Julias, builds
# PackageCompiler sysimages and pulls a container base image, which is CI's job (see
# .github/workflows/e2e.yml), not the registry's. These targets cover the consumer seam:
# the toolchain, a depot fetch, a hook, and a declared depot.
#
# Linux x86_64 only, because the toolchain defaults to the official Linux x86_64 tarball.
# Bazel 9 only, because e2e/MODULE.bazel needs it (see the aspect_bazel_lib note there).
bcr_test_module:
  module_path: "e2e"
  matrix:
    platform: ["debian13", "ubuntu2404"]
    bazel: ["9.*"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//tests:toolchain_version_1_12_test"
        - "//tests:depot_stamp_1_12_test"
        - "//tests:hook_1_12_test"
        - "//tests:declared_depot_1_12_test"
