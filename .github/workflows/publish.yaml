# Opens a pull request against the Bazel Central Registry for a released tag, from the
# .bcr/ templates. Called by release.yaml; dispatch it by hand to retry a failed publish.
#
# Needs a BCR_PUBLISH_TOKEN secret: a classic PAT with "repo" and "workflow" scopes that
# can push to the registry fork below.
name: publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
    secrets:
      publish_token:
        required: true
  workflow_dispatch:
    inputs:
      tag_name:
        description: The git tag being released, e.g. v0.1.0
        required: true
        type: string

jobs:
  publish:
    # https://github.com/bazel-contrib/publish-to-bcr/blob/main/.github/workflows/publish.yaml
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.1
    with:
      tag_name: ${{ inputs.tag_name }}
      # The fork of bazelbuild/bazel-central-registry the pull request is opened from.
      registry_fork: csvance/bazel-central-registry
      # A personal account opens the PR as a draft; mark it ready by hand.
      draft: true
    permissions:
      attestations: write
      contents: write
      id-token: write
    secrets:
      publish_token: ${{ secrets.publish_token || secrets.BCR_PUBLISH_TOKEN }}
