# A deliberately tiny environment for the end-to-end tests, resolved under Julia 1.10 and
# pinned by the Manifest.toml beside this file. Two dependencies, chosen for what they
# exercise rather than for what they do:
#
#   Bzip2_jll  a JLL, so there is exactly one artifact to find in an image layer, to
#              override, and to measure with artifact_paths.jl. Half a megabyte.
#   Crayons    pure Julia with no dependencies of its own, so a sysimage of it builds
#              in the time PackageCompiler needs and not a minute more.
#
# Resolved against the PUBLIC package server. The Testing section of the top-level
# README.md has the command that regenerates this and the Manifest beside it.
[deps]
Bzip2_jll = "6e34b625-4abd-537c-b88f-471c36dfa7a0"
Crayons = "a8cc5b0e-0ffa-5ad4-8c14-923d3ee1735f"
