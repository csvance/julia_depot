name: julia 1.13

# The end-to-end suite on Julia 1.13. The steps are in e2e.yml. Each supported version has
# its own file, and so its own status badge in the README. To add a version, copy this file,
# change the version and tag, and add its badge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: julia-1.13-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: read is for e2e.yml's changes job, which skips the suite on a
# docs-only change.
permissions:
  contents: read
  pull-requests: read

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml
    with:
      julia: "1.13"
      tag: julia1_13
