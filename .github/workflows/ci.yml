name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The runner has no private network, so pin the public package server. e2e/.bazelrc sets
  # the same pin for repository rules and e2e/tests/defs.bzl for test actions; this one
  # covers anything run outside Bazel.
  JULIA_PKG_SERVER: https://pkg.julialang.org

jobs:
  # Cheap and unconditional. This repository is public, and a leaked private reference is
  # textual, so no build or test would fail on it.
  public:
    name: no private references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check_no_private_refs.sh

  # The release fails on a version with no CHANGELOG.md section. This job reports that on the
  # pull request that bumps the version, before the tag is pushed.
  release_notes:
    name: release notes for the declared version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="$(sed -n 's/^ *version = "\([^"]*\)".*/\1/p' MODULE.bazel | head -n 1)"
          .github/workflows/release_notes.sh "${version}"

  buildifier:
    name: buildifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install buildifier
        env:
          BUILDIFIER_VERSION: "8.5.1"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/buildifier \
            "https://github.com/bazelbuild/buildtools/releases/download/v${BUILDIFIER_VERSION}/buildifier-linux-amd64"
          chmod +x /tmp/buildifier
      - run: /tmp/buildifier -mode=check -lint=warn -r .
